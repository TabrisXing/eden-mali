#
# Android RelWithDebInfo build for the mali branch. The APK and the tail of the
# build log are published as assets of a Release whose tag is the short commit
# hash, so they can be fetched without logging in.

name: android

on:
  push:
    branches: [ mali-control ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Compute the release tag
        id: rev
        run: echo "tag=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc \
                      /usr/local/lib/android/sdk/ndk \
                      /usr/local/lib/android/sdk/system-images \
                      /usr/local/lib/android/sdk/emulator
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          {
            SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            echo "SDK root: $SDK"
            if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
              echo "cmdline-tools missing, downloading the official archive"
              mkdir -p "$SDK/cmdline-tools"
              curl -fsSL -o /tmp/clt.zip \
                https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
              unzip -q -o /tmp/clt.zip -d /tmp/clt
              rm -rf "$SDK/cmdline-tools/latest"
              mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
            fi
            echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
            echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            echo "$SDK/platform-tools" >> "$GITHUB_PATH"
            ls -la "$SDK/cmdline-tools/latest/bin"
          } 2>&1 | tee -a build.log

      - name: Install SDK packages
        run: |
          set -euo pipefail
          {
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager --install "platform-tools" "platforms;android-36"
            sdkmanager --install "ndk;28.2.13676358"
            sdkmanager --install "cmake;3.31.6"
            # AGP picks its own build-tools; install the likely ones but never
            # let a missing one abort the job here (the log will show it).
            sdkmanager --install "build-tools;35.0.0" || true
            sdkmanager --install "build-tools;36.0.0" || true
            sdkmanager --list_installed || true
          } 2>&1 | tee -a build.log

      - name: Install host tools
        run: |
          set -euo pipefail
          {
            # src/video_core/host_shaders/CMakeLists.txt:105 hard-fails without
            # glslangValidator on PATH.
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends glslang-tools
            glslangValidator --version | head -2
          } 2>&1 | tee -a build.log

      - name: Toolchain versions
        run: |
          set -euo pipefail
          {
            java -version
            cmake --version | head -1
            echo "ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-unset}"
          } 2>&1 | tee -a build.log

      - name: Build (standard, RelWithDebInfo)
        run: |
          set -o pipefail
          chmod +x .ci/android/build.sh
          .ci/android/build.sh -t standard -b RelWithDebInfo 2>&1 | tee -a build.log

      - name: Collect the log tail
        if: always()
        run: |
          if [ -f build.log ]; then
            tail -n 400 build.log > build-tail.log
          else
            echo "build.log was not produced" > build-tail.log
          fi

      - name: Publish the APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.rev.outputs.tag }}"
          TAG="${TAG:-${GITHUB_SHA:0:8}}"
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --title "mali $TAG" \
              --notes "Automated RelWithDebInfo build of ${GITHUB_SHA}"
          shopt -s nullglob
          apks=(artifacts/*.apk)
          echo "apk count: ${#apks[@]}"
          if [ ${#apks[@]} -gt 0 ]; then
            gh release upload "$TAG" "${apks[@]}" --clobber
          fi

      - name: Publish the log tail
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.rev.outputs.tag }}"
          TAG="${TAG:-${GITHUB_SHA:0:8}}"
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --title "mali $TAG" \
              --notes "Automated RelWithDebInfo build of ${GITHUB_SHA}"
          [ -f build-tail.log ] || echo "no log tail" > build-tail.log
          gh release upload "$TAG" build-tail.log --clobber
